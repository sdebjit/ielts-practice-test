# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 9843a666.nip.io 152.67.166.102 152.67.166.102.nip.io 152.67.166.102.sslip.io _;

    # Certbot challenge path
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS - SSL Reverse Proxy
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 9843a666.nip.io 152.67.166.102 152.67.166.102.nip.io 152.67.166.102.sslip.io _;

    # SSL Certificates (Let's Encrypt / Certbot for nip.io hexadecimal notation)
    ssl_certificate /etc/letsencrypt/live/9843a666.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/9843a666.nip.io/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Client body size limit
    client_max_body_size 25M;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Proxy to IELTS Master Python Server
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for Gemini AI streaming and evaluations
        proxy_connect_timeout 60s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }
}
